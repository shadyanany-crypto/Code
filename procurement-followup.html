<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Procurement Follow-up Center</title>
<style>
:root{color-scheme:dark;font-family:Segoe UI,Arial,sans-serif;background:#0b1220;color:#e8eef9}body{margin:0;padding:24px;background:linear-gradient(135deg,#0b1220,#101d32)}.wrap{max-width:1250px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:26px}.sub{color:#9fb0ca;margin:8px 0 20px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:18px 0}.card,.panel{background:#142238;border:1px solid #253b58;border-radius:12px;padding:16px}.metric{font-size:26px;font-weight:700;margin-top:8px}.grid{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:16px}label{display:block;font-size:13px;color:#b7c6dc;margin:12px 0 6px}input,select,textarea{box-sizing:border-box;width:100%;padding:10px;border-radius:8px;border:1px solid #344b69;background:#0d1829;color:#edf4ff}textarea{min-height:90px;resize:vertical}button{background:#3278df;color:white;border:0;padding:10px 14px;border-radius:8px;font-weight:600;cursor:pointer;margin-top:12px}button.secondary{background:#30445f}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:11px;border-bottom:1px solid #263a54;font-size:13px}th{color:#a8bdd8} .tablewrap{overflow:auto}.pill{padding:4px 8px;border-radius:20px;background:#243d5d;display:inline-block}.urgent{background:#7e2e36}.high{background:#7b5122}.empty{padding:24px;color:#9fb0ca;text-align:center}.message{margin-top:10px;color:#9bd5ac}.error{color:#ff9c9c}@media(max-width:850px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><header><div><h1>Procurement Follow-up Center</h1><div class="sub">Create, prioritize, and track supplier quotation follow-ups.</div></div><button class="secondary" onclick="loadAll()">Refresh</button></header>
<div class="cards"><div class="card">Open Follow-ups<div class="metric" id="openCount">—</div></div><div class="card">Urgent / High<div class="metric" id="priorityCount">—</div></div><div class="card">Completed<div class="metric" id="doneCount">—</div></div><div class="card">Overdue<div class="metric" id="overdueCount">—</div></div></div>
<div class="grid"><section class="panel"><h2 style="margin-top:0">Add Follow-up</h2><form id="followForm"><label>Quotation</label><select id="quotation" required></select><label>Follow-up date</label><input id="date" type="date" required><label>Priority</label><select id="priority"><option>Normal</option><option>Low</option><option>High</option><option>Urgent</option></select><label>Status</label><select id="status"><option>Open</option><option>Completed</option><option>Cancelled</option></select><label>Notes</label><textarea id="notes" placeholder="Call supplier, request revised offer..." required></textarea><button type="submit">Save Follow-up</button><div id="msg"></div></form></section>
<section class="panel"><div style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap"><h2 style="margin:0">Follow-up Register</h2><input id="search" placeholder="Search supplier / RFQ / quote..." style="max-width:280px"><select id="registerStatus" onchange="render()" style="max-width:140px"><option value="all">All statuses</option><option>Open</option><option>Completed</option><option>Cancelled</option></select><select id="registerPriority" onchange="render()" style="max-width:140px"><option value="all">All priorities</option><option>Urgent</option><option>High</option><option>Normal</option><option>Low</option></select><button class="secondary" onclick="exportFollowups()">Export filtered CSV</button></div><div class="tablewrap" style="margin-top:14px"><table><thead><tr><th>Supplier</th><th>RFQ</th><th>Quotation</th><th>Due date</th><th>Priority</th><th>Follow-up Status</th><th>Note</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" class="empty" hidden>No follow-ups yet.</div></section></div></div>
<script>
const token=localStorage.getItem('sqAccessToken')||localStorage.getItem('sq_token');
const headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'};
let followups=[], quotations=[];
function fmt(d){return d?new Date(d).toLocaleDateString():'—'}
function msg(t,err=false){const el=document.getElementById('msg');el.textContent=t;el.className=err?'error':'message'}
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{...headers,...opts.headers}});if(!r.ok){let t=await r.text();throw Error(t||('HTTP '+r.status))}return r.status===204?null:r.json()}
function exportFollowups(){const q=document.getElementById('search').value.toLowerCase(),rs=document.getElementById('registerStatus').value,rp=document.getElementById('registerPriority').value;const list=followups.filter(x=>[x.supplierName,x.rfqNumber,x.quoteNumber,x.notes].join(' ').toLowerCase().includes(q)&&(rs==='all'||x.followUpStatus===rs)&&(rp==='all'||x.priority===rp));const rows=[['Supplier','Supplier Code','RFQ Number','RFQ Title','Quotation Number','Quotation Status','Follow-up Date','Priority','Follow-up Status','Notes'],...list.map(x=>[x.supplierName,x.code,x.rfqNumber,x.rfqTitle,x.quoteNumber,x.status,x.followUpDateUtc,x.priority,x.followUpStatus,x.notes])];const csv=rows.map(r=>r.map(v=>'\"'+String(v??'').replace(/\"/g,'\"\"')+'\"').join(',')).join('\\r\\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='ProcurementFollowups_Filtered.csv';a.click();URL.revokeObjectURL(a.href)}
async function loadAll(){try{[quotations,followups]=await Promise.all([api('/api/quotations'),api('/api/followups/')]);const sel=document.getElementById('quotation');sel.innerHTML=quotations.map(q=>`<option value="${q.id}">${esc(q.quoteNumber)} — ${esc(q.supplier?.name||'Supplier')} / ${esc(q.rfq?.rfqNumber||'RFQ')}</option>`).join('');render()}catch(e){msg('Could not load data: '+e.message,true)}}
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){let open=followups.filter(x=>x.followUpStatus==='Open'),now=new Date();document.getElementById('openCount').textContent=open.length;document.getElementById('priorityCount').textContent=open.filter(x=>['Urgent','High'].includes(x.priority)).length;document.getElementById('doneCount').textContent=followups.filter(x=>x.followUpStatus==='Completed').length;document.getElementById('overdueCount').textContent=open.filter(x=>new Date(x.followUpDateUtc)<now).length;
let q=document.getElementById('search').value.toLowerCase(),rs=document.getElementById('registerStatus').value,rp=document.getElementById('registerPriority').value;let filtered=followups.filter(x=>[x.supplierName,x.rfqNumber,x.quoteNumber,x.notes].join(' ').toLowerCase().includes(q)&&(rs==='all'||x.followUpStatus===rs)&&(rp==='all'||x.priority===rp));document.getElementById('empty').hidden=filtered.length!==0;document.getElementById('rows').innerHTML=filtered.map(x=>`<tr><td>${esc(x.supplierName)}<br><small>${esc(x.code)}</small></td><td>${esc(x.rfqNumber)}<br><small>${esc(x.rfqTitle)}</small></td><td>${esc(x.quoteNumber)}<br><small>${esc(x.status)}</small></td><td>${fmt(x.followUpDateUtc)}</td><td><span class="pill ${x.priority.toLowerCase()}">${esc(x.priority)}</span></td><td><span class="pill">${esc(x.followUpStatus)}</span></td><td>${esc(x.notes)}</td><td>${x.followUpStatus==='Open'?`<button onclick="complete(${x.id})">Complete</button>`:'—'}</td></tr>`).join('')}
document.getElementById('search').addEventListener('input',render);
document.getElementById('followForm').addEventListener('submit',async e=>{e.preventDefault();try{const date=document.getElementById('date').value;await api('/api/followups/',{method:'POST',body:JSON.stringify({supplierQuotationId:+document.getElementById('quotation').value,followUpDateUtc:new Date(date+'T12:00:00Z').toISOString(),priority:document.getElementById('priority').value,status:document.getElementById('status').value,notes:document.getElementById('notes').value})});document.getElementById('notes').value='';msg('Follow-up saved.');await loadAll()}catch(e){msg('Save failed: '+e.message,true)}});
async function complete(id){try{await api('/api/followups/'+id+'/status',{method:'PATCH',body:JSON.stringify({status:'Completed'})});await loadAll()}catch(e){msg('Update failed: '+e.message,true)}}
document.getElementById('date').value=new Date().toISOString().slice(0,10);loadAll();
</script><a id="globalMainAppButton" href="/" title="Return to Main App" style="position:fixed;left:18px;bottom:18px;z-index:99999;display:inline-flex;align-items:center;gap:8px;padding:12px 16px;border-radius:10px;background:#174ea6;color:#fff;text-decoration:none;font:600 14px Arial,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25)">⌂ Main App</a></body></html>
