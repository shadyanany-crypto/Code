<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supplier Quotation • Data</title><style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121e31;--line:#263650;--text:#eaf2ff;--muted:#9db0ca;--blue:#3b82f6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui;padding:22px}main{max-width:1100px;margin:auto}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin:16px 0}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1,h2{margin:0 0 12px}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}input,textarea,button{font:inherit;padding:11px;border-radius:9px;border:1px solid var(--line);background:#0b1526;color:var(--text)}button{background:var(--blue);border:0;cursor:pointer;font-weight:600}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line)}.muted{color:var(--muted)}.msg{color:#93c5fd;margin:10px 0}@media(max-width:600px){body{padding:10px}.panel{padding:12px}}

/* Phase 13 — Premium dark-blue UI refresh */
:root{
 --bg:#060d19!important;--panel:#0d1a2d!important;--line:#1d3554!important;
 --text:#edf5ff!important;--muted:#91a8c6!important;--blue:#087cff!important;
 --green:#10b981!important;--amber:#f59e0b!important;--red:#ef4444!important;
}
html{scroll-behavior:smooth}
body{background:radial-gradient(ellipse at 12% -10%,#102b50 0,transparent 36%),radial-gradient(ellipse at 100% 0,#0a2140 0,transparent 30%),#060d19!important;color:#edf5ff!important;font-family:Inter,"Segoe UI",system-ui,Arial,sans-serif!important}
main,.wrap{max-width:1320px!important}
h1{font-size:clamp(24px,3vw,34px)!important;letter-spacing:-.6px;font-weight:750!important}
h2{letter-spacing:-.3px}
p,small,.muted,.sub{color:#91a8c6!important}
.panel,.tile,.cards>div,.card{background:linear-gradient(145deg,rgba(15,31,52,.97),rgba(9,20,36,.98))!important;border:1px solid #1d3554!important;border-radius:16px!important;box-shadow:0 12px 32px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.025)!important}
input,select,textarea{background:#071426!important;border:1px solid #294465!important;color:#edf5ff!important;border-radius:10px!important;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none!important;border-color:#1687ff!important;box-shadow:0 0 0 3px rgba(8,124,255,.16)!important}
button,.btn,.actions a,.head a,header a{border-radius:10px!important;transition:transform .15s,filter .15s,background .15s}
button:not(.secondary):not(.btn2){background:linear-gradient(135deg,#087cff,#075bd4)!important;color:#fff!important;box-shadow:0 5px 15px rgba(8,124,255,.16)}
button:hover,a:hover{filter:brightness(1.13);transform:translateY(-1px)}
.secondary,.btn2{background:#172b45!important;color:#dcecff!important;border:1px solid #294465!important}
a{color:#7fc0ff}
table{border-collapse:separate!important;border-spacing:0!important;border:1px solid #1d3554!important;border-radius:12px!important;overflow:hidden}
th{background:#10243d!important;color:#d9eaff!important;font-weight:650!important}
td,th{border-bottom:1px solid #1b304b!important;padding:12px!important}
tr:hover td{background:rgba(17,52,88,.22)}
hr{border:0;border-top:1px solid #1d3554}
.badge,.status{border-radius:999px!important}
@media(max-width:700px){
 body{padding:12px!important}
 main,.wrap{padding-left:0!important;padding-right:0!important}
 .panel{padding:14px!important;margin:12px 0!important}
 table{min-width:680px}
 h1{font-size:24px!important}
}

</style><style>
/* Phase 14 — Dashboard and Portal visual polish */
body:has(.cards) .cards{gap:16px}
body:has(.cards) .card{position:relative;overflow:hidden;padding:20px 21px!important;min-height:112px}
body:has(.cards) .card:before{content:"";position:absolute;right:-34px;top:-42px;width:110px;height:110px;border-radius:50%;background:rgba(8,124,255,.09);pointer-events:none}
.metric{font-size:clamp(28px,3vw,36px)!important;line-height:1.15;color:#f5f9ff!important;letter-spacing:-1px}
.label{font-size:12px!important;letter-spacing:.5px;text-transform:uppercase;color:#9bb4d2!important;font-weight:650}
.head{padding-bottom:6px}
.head h1{background:linear-gradient(90deg,#f4f8ff,#8fc7ff);-webkit-background-clip:text;background-clip:text;color:transparent!important}
.actions button{border:1px solid rgba(88,145,210,.22)!important}
.grid{gap:16px!important}
.panel{padding:20px!important}
.panel h2{margin-top:0;color:#e7f2ff!important}
.tile{background:linear-gradient(150deg,#10233c,#0a1729)!important;transition:transform .18s,border-color .18s,box-shadow .18s}
.tile:hover{transform:translateY(-3px);border-color:#2f75c4!important;box-shadow:0 12px 30px rgba(0,0,0,.2)}
.tile h3{font-size:17px!important;color:#f0f7ff}
.tag{border:1px solid #2b4b70!important;background:#102b49!important;color:#9bcaff!important}
table{width:100%}
@media(max-width:780px){
 .grid{grid-template-columns:1fr!important}
 .head{align-items:flex-start!important}
 .actions{width:100%}
 .actions button{flex:1}
}
</style></head><body><main><header><div><h1>Supplier & RFQ Workspace</h1><div class="muted">Shared SQL Server business data</div></div><button onclick="location.href='/'">Back to application</button></header>
<section class="panel"><h2>Add Supplier</h2><form id="supplier"><input name="code" placeholder="Supplier code" required><input name="name" placeholder="Supplier name" required><input name="contactName" placeholder="Contact person"><input name="email" type="email" placeholder="Email"><input name="phone" placeholder="Phone"><input name="address" placeholder="Address"><input name="notes" placeholder="Notes"><button>Add Supplier</button></form><div id="supplierMsg" class="msg"></div></section>
<section class="panel"><header><h2>Suppliers</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="secondary" id="supplierExport">Export CSV</button><button onclick="loadSuppliers()">Refresh</button></div></header><input id="supplierSearch" type="search" placeholder="Search suppliers by code, name, contact, email, phone..." style="width:100%;margin:10px 0;padding:11px"><div style="overflow:auto"><table><thead><tr><th>Code</th><th>Name</th><th>Contact</th><th>Email</th><th>Phone</th><th>Status</th></tr></thead><tbody id="supplierRows"></tbody></table></div></section>
<section class="panel"><h2>Create RFQ (one item)</h2><form id="rfq"><input name="rfqNumber" placeholder="RFQ number" required><input name="title" placeholder="Title" required><input name="dueDateUtc" type="datetime-local" required><input name="itemCode" placeholder="Item code"><input name="itemDescription" placeholder="Item description" required><input name="unit" placeholder="Unit (pcs, kg...)" required><input name="quantity" type="number" min="0.001" step="0.001" placeholder="Quantity" required><button>Create RFQ</button></form><div id="rfqMsg" class="msg"></div></section>
<section class="panel"><header><h2>RFQs</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="secondary" id="rfqExport">Export CSV</button><button onclick="loadRfqs()">Refresh</button></div></header><input id="rfqSearch" type="search" placeholder="Search RFQs by number, title, status..." style="width:100%;margin:10px 0;padding:11px"><div style="overflow:auto"><table><thead><tr><th>Number</th><th>Title</th><th>Status</th><th>Due date</th><th>Items</th></tr></thead><tbody id="rfqRows"></tbody></table></div></section><footer class="muted">Copyright © Shady Anany</footer></main>
<script>
const token=localStorage.getItem('sqAccessToken')||localStorage.getItem('sq_token');if(!token)location.href='/';const msg=(id,t)=>document.getElementById(id).textContent=t;
async function api(path,method='GET',body){const r=await fetch('/api'+path,{method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error(await r.text()||r.status);return r.status===204?null:r.json()}
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
let suppliersCache=[],rfqsCache=[];
function renderSuppliers(){const term=document.getElementById('supplierSearch').value.trim().toLowerCase();const rows=suppliersCache.filter(x=>[x.code,x.name,x.contactName,x.email,x.phone,x.isActive?'Active':'Inactive'].join(' ').toLowerCase().includes(term));document.getElementById('supplierRows').innerHTML=rows.map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${esc(x.contactName)}</td><td>${esc(x.email)}</td><td>${esc(x.phone)}</td><td>${x.isActive?'Active':'Inactive'}</td></tr>`).join('')||'<tr><td colspan="6">No matching suppliers.</td></tr>'}
function renderRfqs(){const term=document.getElementById('rfqSearch').value.trim().toLowerCase();const rows=rfqsCache.filter(x=>[x.rfqNumber,x.title,x.status,new Date(x.dueDateUtc).toLocaleString()].join(' ').toLowerCase().includes(term));document.getElementById('rfqRows').innerHTML=rows.map(x=>`<tr><td>${esc(x.rfqNumber)}</td><td>${esc(x.title)}</td><td>${esc(x.status)}</td><td>${new Date(x.dueDateUtc).toLocaleString()}</td><td>${x.items?.length||0}</td></tr>`).join('')||'<tr><td colspan="5">No matching RFQs.</td></tr>'}
async function loadSuppliers(){try{suppliersCache=await api('/suppliers');renderSuppliers()}catch(e){msg('supplierMsg',e.message)}}
async function loadRfqs(){try{rfqsCache=await api('/rfqs');renderRfqs()}catch(e){msg('rfqMsg',e.message)}}
function csvCell(v){return '"'+String(v??'').replaceAll('"','""')+'"'}
function exportCsv(filename,headers,rows){const text=[headers.map(csvCell).join(','),...rows.map(row=>headers.map(h=>csvCell(row[h])).join(','))].join('\\r\\n');const blob=new Blob(['\\uFEFF'+text],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url)}
document.getElementById('supplierSearch').addEventListener('input',renderSuppliers);
document.getElementById('rfqSearch').addEventListener('input',renderRfqs);
document.getElementById('supplierExport').onclick=()=>{const term=document.getElementById('supplierSearch').value.trim().toLowerCase();const rows=suppliersCache.filter(x=>[x.code,x.name,x.contactName,x.email,x.phone,x.isActive?'Active':'Inactive'].join(' ').toLowerCase().includes(term)).map(x=>({'Code':x.code,'Name':x.name,'Contact':x.contactName,'Email':x.email,'Phone':x.phone,'Status':x.isActive?'Active':'Inactive'}));exportCsv('suppliers.csv',['Code','Name','Contact','Email','Phone','Status'],rows)};
document.getElementById('rfqExport').onclick=()=>{const term=document.getElementById('rfqSearch').value.trim().toLowerCase();const rows=rfqsCache.filter(x=>[x.rfqNumber,x.title,x.status,new Date(x.dueDateUtc).toLocaleString()].join(' ').toLowerCase().includes(term)).map(x=>({'RFQ Number':x.rfqNumber,'Title':x.title,'Status':x.status,'Due Date':new Date(x.dueDateUtc).toLocaleString(),'Items':x.items?.length||0}));exportCsv('rfqs.csv',['RFQ Number','Title','Status','Due Date','Items'],rows)};
document.getElementById('supplier').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{await api('/suppliers','POST',{code:f.get('code'),name:f.get('name'),contactName:f.get('contactName')||'',email:f.get('email')||'',phone:f.get('phone')||'',address:f.get('address')||'',notes:f.get('notes')||''});msg('supplierMsg','Supplier added.');e.target.reset();loadSuppliers()}catch(x){msg('supplierMsg',x.message)}};
document.getElementById('rfq').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{await api('/rfqs','POST',{rfqNumber:f.get('rfqNumber'),title:f.get('title'),description:'',dueDateUtc:new Date(f.get('dueDateUtc')).toISOString(),items:[{itemCode:f.get('itemCode')||'',description:f.get('itemDescription'),unit:f.get('unit'),quantity:Number(f.get('quantity'))}]});msg('rfqMsg','RFQ created.');e.target.reset();loadRfqs()}catch(x){msg('rfqMsg',x.message)}};
loadSuppliers();loadRfqs();
</script><a id="globalMainAppButton" href="/" title="Return to Main App" style="position:fixed;left:18px;bottom:18px;z-index:99999;display:inline-flex;align-items:center;gap:8px;padding:12px 16px;border-radius:10px;background:#174ea6;color:#fff;text-decoration:none;font:600 14px Arial,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25)">⌂ Main App</a></body></html>
