<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMTP Test | Supplier Quotation</title>
<style>body{font:15px Segoe UI,Arial;background:#101827;color:#e8eef8;margin:0;padding:32px}.card{max-width:620px;margin:auto;background:#182438;border:1px solid #30415c;border-radius:14px;padding:24px}h1{font-size:24px}p{color:#b8c5d8}label{display:block;margin:18px 0 8px}input{width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid #405573;background:#0e1726;color:#fff}button{margin-top:16px;padding:11px 18px;border:0;border-radius:8px;background:#3678e5;color:white;font-weight:600;cursor:pointer}#result{margin-top:18px;white-space:pre-wrap}</style></head>
<body><main class="card"><h1>SMTP Test Email</h1><p>SMTP server credentials are configured through server environment variables. This page only sends a test message.</p><label for="to">Recipient email</label><input id="to" type="email" placeholder="admin@company.com" required><button id="send">Send Test Email</button><div id="result"></div></main>
<script>
const token=localStorage.getItem('sqAccessToken')||localStorage.getItem('sq_token');
document.getElementById('send').addEventListener('click',async()=>{const to=document.getElementById('to').value.trim();const result=document.getElementById('result');if(!token){result.textContent='Login required. Open this page after signing in.';return;}if(!to){result.textContent='Enter a valid recipient email.';return;}result.textContent='Sending...';try{const r=await fetch('/api/email/test',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({to})});const data=await r.json().catch(()=>({}));result.textContent=r.ok?(data.message||'Sent.'):(data.detail||data.message||('Request failed: '+r.status));}catch(e){result.textContent='Connection error: '+e.message;}});
</script><a id="globalMainAppButton" href="/" title="Return to Main App" style="position:fixed;left:18px;bottom:18px;z-index:99999;display:inline-flex;align-items:center;gap:8px;padding:12px 16px;border-radius:10px;background:#174ea6;color:#fff;text-decoration:none;font:600 14px Arial,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25)">⌂ Main App</a></body></html>
