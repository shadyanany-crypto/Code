<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quotation Aging | Supplier Quotation</title>
<style>
:root{--bg:#0b1220;--panel:#121d30;--line:#263650;--text:#e8eef8;--muted:#95a8c3;--accent:#6ea8fe;--red:#ff7777;--amber:#ffc66d;--green:#47d7a0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Segoe UI,Arial,sans-serif}.wrap{max-width:1250px;margin:auto;padding:26px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:26px}.sub{color:var(--muted);margin:5px 0 22px}.btn{background:#1d2b43;color:var(--text);border:1px solid var(--line);padding:9px 13px;border-radius:9px;cursor:pointer}.primary{background:#2455a6;border-color:#326bc5}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:18px 0}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px}.k{color:var(--muted);font-size:12px}.v{font-size:25px;font-weight:700;margin-top:5px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.toolbar input,.toolbar select{background:#0d1728;color:var(--text);border:1px solid var(--line);padding:10px;border-radius:9px}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}th{color:var(--muted)}.panel{overflow:auto}.pill{border-radius:20px;padding:4px 9px;font-size:12px}.critical{background:#4a222b;color:#ffaaaa}.warning{background:#49351d;color:#ffd38c}.normal{background:#193e36;color:#7be4bb}.empty{text-align:center;padding:25px;color:var(--muted)}
</style></head><body><main class="wrap"><div class="top"><div><h1>Quotation Aging & Follow-up</h1><div class="sub">Track open quotations by age and identify items that may need follow-up.</div></div><div><button class="btn" onclick="location.href='portal.html'">← Portal</button> <button class="btn primary" onclick="loadData()">Refresh</button> <button class="btn" onclick="exportCsv()">Export CSV</button></div></div>
<div class="cards"><div class="card"><div class="k">Open / Pending</div><div class="v" id="open">—</div></div><div class="card"><div class="k">Older than 7 days</div><div class="v" id="seven">—</div></div><div class="card"><div class="k">Older than 14 days</div><div class="v" id="fourteen">—</div></div><div class="card"><div class="k">Average age (days)</div><div class="v" id="avg">—</div></div></div>
<div class="toolbar"><input id="search" placeholder="Search quotation / supplier…" oninput="render()"><select id="age" onchange="render()"><option value="all">All aging</option><option value="7">7+ days</option><option value="14">14+ days</option><option value="30">30+ days</option></select><select id="status" onchange="render()"><option value="open">Open statuses</option><option value="all">All statuses</option></select><span id="resultCount" style="color:var(--muted);align-self:center">— results</span></div><section class="panel"><table><thead><tr><th>Quotation</th><th>Supplier</th><th>Status</th><th>Created / Submitted</th><th>Age (days)</th><th>Follow-up</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" hidden>No matching quotations.</div></section>
</main><script>
const token=localStorage.getItem('sqAccessToken')||localStorage.getItem('sq_token');let data=[];const openSet=['pending','submitted','draft','review','awaiting approval','awaitingapproval'];
async function api(url){const r=await fetch(url,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error(r.status+' '+r.statusText);return r.json()}
function dateOf(q){return q.submittedUtc||q.createdUtc||q.createdAt||q.date||null}
function statusOf(q){return String(q.status||'Unknown')}
function isOpen(q){return openSet.includes(statusOf(q).toLowerCase())}
async function loadData(){try{if(!token){location.href='index.html';return}const qs=await api('/api/quotations');const now=Date.now();data=qs.map(q=>{const dt=dateOf(q);const age=dt?Math.max(0,Math.floor((now-new Date(dt).getTime())/86400000)):0;return {...q,age,dt,open:isOpen(q),supplierName:q.supplier?.name||q.supplierName||'—',number:q.number||q.quotationNumber||q.code||('Quotation #'+q.id)}});const open=data.filter(q=>q.open);document.getElementById('open').textContent=open.length;document.getElementById('seven').textContent=open.filter(q=>q.age>=7).length;document.getElementById('fourteen').textContent=open.filter(q=>q.age>=14).length;document.getElementById('avg').textContent=open.length?(open.reduce((s,q)=>s+q.age,0)/open.length).toFixed(1):'0';render()}catch(e){document.getElementById('rows').innerHTML='<tr><td colspan="6">Could not load quotations: '+esc(e.message)+'</td></tr>'}}
function getFiltered(){const term=document.getElementById('search').value.toLowerCase(),age=document.getElementById('age').value,all=document.getElementById('status').value==='all';return data.filter(q=>(all||q.open)&&(age==='all'||q.age>=Number(age))&&(q.number+' '+q.supplierName+' '+statusOf(q)).toLowerCase().includes(term)).sort((a,b)=>b.age-a.age)}
function render(){const list=getFiltered();document.getElementById('rows').innerHTML=list.map(q=>{const level=q.age>=14?'critical':q.age>=7?'warning':'normal';const note=q.age>=14?'Urgent follow-up':q.age>=7?'Follow up':'Within target';return `<tr><td>${esc(q.number)}</td><td>${esc(q.supplierName)}</td><td>${esc(statusOf(q))}</td><td>${q.dt?new Date(q.dt).toLocaleDateString():'—'}</td><td>${q.age}</td><td><span class="pill ${level}">${note}</span></td></tr>`}).join('');document.getElementById('empty').hidden=list.length>0;document.getElementById('resultCount').textContent=list.length+' result'+(list.length===1?'':'s')}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function exportCsv(){const list=getFiltered();const rows=[['Quotation','Supplier','Status','Date','Age Days','Follow-up'],...list.map(q=>[q.number,q.supplierName,statusOf(q),q.dt||'',q.age,q.age>=14?'Urgent follow-up':q.age>=7?'Follow up':'Within target'])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\\r\\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='QuotationAging.csv';a.click();URL.revokeObjectURL(a.href)}loadData();
</script><a id="globalMainAppButton" href="/" title="Return to Main App" style="position:fixed;left:18px;bottom:18px;z-index:99999;display:inline-flex;align-items:center;gap:8px;padding:12px 16px;border-radius:10px;background:#174ea6;color:#fff;text-decoration:none;font:600 14px Arial,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25)">⌂ Main App</a></body></html>
