<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Supplier Quotation System | Reports</title>
<style>
:root{--bg:#0b1220;--panel:#111c30;--line:#263650;--text:#e8eef8;--muted:#9fb0c8;--accent:#4da3ff;--good:#2dd4bf}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#08101d,#101b2d);color:var(--text);font:15px Segoe UI,Arial,sans-serif}
.wrap{max-width:1250px;margin:32px auto;padding:0 18px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap}
h1{margin:0 0 7px;font-size:27px}.sub{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:20px;box-shadow:0 14px 40px #0002}
.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.field{display:grid;gap:7px;color:var(--muted)}select,input{min-width:210px;background:#0b1424;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px}
button,.link{background:var(--accent);color:#071426;border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer;text-decoration:none}.secondary{background:#1b2b44;color:var(--text);border:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:18px}.metric{background:#0b1424;border:1px solid var(--line);border-radius:12px;padding:15px}.metric small{color:var(--muted)}.metric strong{display:block;font-size:24px;margin-top:8px}
.tablewrap{overflow:auto;margin-top:16px}table{border-collapse:collapse;width:100%;min-width:700px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:#bcd2ed;background:#0b1424}
.notice{color:var(--muted);margin-top:12px}.error{color:#ff9d9d}
@media print{body{background:white;color:#111}.wrap{max-width:none;margin:0}.panel{background:white;border:0;box-shadow:none;padding:0}.sub,.notice,.controls button,.controls select,.controls input,label{display:none!important}.metric{background:white;border:1px solid #bbb;color:#111}th{background:#eee;color:#111}td,th{border-color:#ccc}.tablewrap{overflow:visible}table{min-width:0}}

/* Phase 13 — Premium dark-blue UI refresh */
:root{
 --bg:#060d19!important;--panel:#0d1a2d!important;--line:#1d3554!important;
 --text:#edf5ff!important;--muted:#91a8c6!important;--blue:#087cff!important;
 --green:#10b981!important;--amber:#f59e0b!important;--red:#ef4444!important;
}
html{scroll-behavior:smooth}
body{background:radial-gradient(ellipse at 12% -10%,#102b50 0,transparent 36%),radial-gradient(ellipse at 100% 0,#0a2140 0,transparent 30%),#060d19!important;color:#edf5ff!important;font-family:Inter,"Segoe UI",system-ui,Arial,sans-serif!important}
main,.wrap{max-width:1320px!important}
h1{font-size:clamp(24px,3vw,34px)!important;letter-spacing:-.6px;font-weight:750!important}
h2{letter-spacing:-.3px}
p,small,.muted,.sub{color:#91a8c6!important}
.panel,.tile,.cards>div,.card{background:linear-gradient(145deg,rgba(15,31,52,.97),rgba(9,20,36,.98))!important;border:1px solid #1d3554!important;border-radius:16px!important;box-shadow:0 12px 32px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.025)!important}
input,select,textarea{background:#071426!important;border:1px solid #294465!important;color:#edf5ff!important;border-radius:10px!important;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none!important;border-color:#1687ff!important;box-shadow:0 0 0 3px rgba(8,124,255,.16)!important}
button,.btn,.actions a,.head a,header a{border-radius:10px!important;transition:transform .15s,filter .15s,background .15s}
button:not(.secondary):not(.btn2){background:linear-gradient(135deg,#087cff,#075bd4)!important;color:#fff!important;box-shadow:0 5px 15px rgba(8,124,255,.16)}
button:hover,a:hover{filter:brightness(1.13);transform:translateY(-1px)}
.secondary,.btn2{background:#172b45!important;color:#dcecff!important;border:1px solid #294465!important}
a{color:#7fc0ff}
table{border-collapse:separate!important;border-spacing:0!important;border:1px solid #1d3554!important;border-radius:12px!important;overflow:hidden}
th{background:#10243d!important;color:#d9eaff!important;font-weight:650!important}
td,th{border-bottom:1px solid #1b304b!important;padding:12px!important}
tr:hover td{background:rgba(17,52,88,.22)}
hr{border:0;border-top:1px solid #1d3554}
.badge,.status{border-radius:999px!important}
@media(max-width:700px){
 body{padding:12px!important}
 main,.wrap{padding-left:0!important;padding-right:0!important}
 .panel{padding:14px!important;margin:12px 0!important}
 table{min-width:680px}
 h1{font-size:24px!important}
}

</style><style>
/* Phase 14 — Dashboard and Portal visual polish */
body:has(.cards) .cards{gap:16px}
body:has(.cards) .card{position:relative;overflow:hidden;padding:20px 21px!important;min-height:112px}
body:has(.cards) .card:before{content:"";position:absolute;right:-34px;top:-42px;width:110px;height:110px;border-radius:50%;background:rgba(8,124,255,.09);pointer-events:none}
.metric{font-size:clamp(28px,3vw,36px)!important;line-height:1.15;color:#f5f9ff!important;letter-spacing:-1px}
.label{font-size:12px!important;letter-spacing:.5px;text-transform:uppercase;color:#9bb4d2!important;font-weight:650}
.head{padding-bottom:6px}
.head h1{background:linear-gradient(90deg,#f4f8ff,#8fc7ff);-webkit-background-clip:text;background-clip:text;color:transparent!important}
.actions button{border:1px solid rgba(88,145,210,.22)!important}
.grid{gap:16px!important}
.panel{padding:20px!important}
.panel h2{margin-top:0;color:#e7f2ff!important}
.tile{background:linear-gradient(150deg,#10233c,#0a1729)!important;transition:transform .18s,border-color .18s,box-shadow .18s}
.tile:hover{transform:translateY(-3px);border-color:#2f75c4!important;box-shadow:0 12px 30px rgba(0,0,0,.2)}
.tile h3{font-size:17px!important;color:#f0f7ff}
.tag{border:1px solid #2b4b70!important;background:#102b49!important;color:#9bcaff!important}
table{width:100%}
@media(max-width:780px){
 .grid{grid-template-columns:1fr!important}
 .head{align-items:flex-start!important}
 .actions{width:100%}
 .actions button{flex:1}
}
</style></head>
<body><div class="wrap">
<header class="top"><div><h1>Reports & Export</h1><div class="sub">Supplier quotations, RFQ status and supplier summary</div></div>
<div><a class="link secondary" href="dashboard.html">← Dashboard</a></div></header>
<section class="panel">
<div class="controls">
<label class="field">Report type<select id="type"><option value="quotations">Quotation Register</option><option value="rfqs">RFQ Summary</option><option value="suppliers">Supplier Summary</option></select></label>
<label class="field">Search<input id="search" placeholder="Search visible report…"></label>
<label class="field">Status<select id="status"><option value="">All statuses</option><option>Open</option><option>Pending</option><option>Approved</option><option>Rejected</option><option>Awarded</option><option>Active</option><option>Disabled</option><option>Draft</option><option>Closed</option></select></label>
<label class="field">From<input id="from" type="date"></label><label class="field">To<input id="to" type="date"></label>
<button id="refresh">Refresh data</button><button id="excel" class="secondary">Export Excel</button><button id="csv" class="secondary">Export CSV</button><button id="pdf" class="secondary">Print / Save PDF</button><button id="clear" class="secondary">Clear filters</button>
</div>
<div class="cards" id="metrics"></div>
<div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
<div class="notice" id="notice">Loading report data…</div>
</section></div>
<script>
const token=localStorage.getItem('sqAccessToken')||localStorage.getItem('sq_token');
if(!token){location.href='index.html';}
const $=id=>document.getElementById(id);
let data={quotations:[],rfqs:[],suppliers:[]}, currentRows=[], currentHeaders=[];
const money=n=>Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
async function get(path){const r=await fetch(path,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw new Error(path+' returned '+r.status);return r.json();}
function total(q){return (q.lines||[]).reduce((s,l)=>s+Number(l.quantity||0)*Number(l.unitPrice||0)*(1+Number(l.taxPercent||0)/100),0);}
function rowsFor(type){
 if(type==='quotations')return data.quotations.map(q=>({ID:q.id,RFQ:q.rfq?.title||q.rfq?.referenceNo||q.rfqId||'',Supplier:q.supplier?.name||q.supplierId||'',Status:q.status||'',Total:total(q),Submitted:q.submittedUtc||q.createdUtc||'',Decision:q.decisionNote||'',Awarded:q.awarded?'Yes':'No'}));
 if(type==='rfqs')return data.rfqs.map(r=>({ID:r.id,Reference:r.referenceNo||'',Title:r.title||'',Status:r.status||'',Items:(r.items||[]).length,Created:r.createdUtc||'',Deadline:r.deadlineUtc||''}));
 return data.suppliers.map(s=>({ID:s.id,Name:s.name||'',Contact:s.contactName||'',Email:s.email||'',Phone:s.phone||'',Status:s.isActive===false?'Disabled':'Active'}));
}
function draw(){
 const type=$('type').value, search=$('search').value.toLowerCase(), status=$('status').value;
 const dateKey=type==='quotations'?'Submitted':type==='rfqs'?'Created':'';
 currentRows=rowsFor(type).filter(row=>{
  if(!Object.values(row).join(' ').toLowerCase().includes(search))return false;
  if(status && String(row.Status||'').toLowerCase()!==status.toLowerCase())return false;
  if(dateKey){const raw=row[dateKey], date=raw?new Date(raw):null; if($('from').value && (!date||date<new Date($('from').value+'T00:00:00')))return false; if($('to').value && (!date||date>new Date($('to').value+'T23:59:59')))return false;}
  return true;
 });
 currentHeaders=currentRows.length?Object.keys(currentRows[0]):(type==='quotations'?['ID','RFQ','Supplier','Status','Total','Submitted','Decision','Awarded']:type==='rfqs'?['ID','Reference','Title','Status','Items','Created','Deadline']:['ID','Name','Contact','Email','Phone','Status']);
 $('thead').innerHTML='<tr>'+currentHeaders.map(h=>'<th>'+h+'</th>').join('')+'</tr>';
 $('tbody').innerHTML=currentRows.map(row=>'<tr>'+currentHeaders.map(h=>'<td>'+(h==='Total'?money(row[h]):String(row[h]??'').replaceAll('&','&amp;').replaceAll('<','&lt;'))+'</td>').join('')+'</tr>').join('');
 const all=rowsFor(type);
 const cards=type==='quotations'?[['Quotations',all.length],['Awarded',all.filter(x=>x.Awarded==='Yes').length],['Total value',money(all.reduce((s,x)=>s+x.Total,0))],['Filtered rows',currentRows.length]]:
 type==='rfqs'?[['Total RFQs',all.length],['Open',all.filter(x=>String(x.Status).toLowerCase()==='open').length],['RFQ items',all.reduce((s,x)=>s+Number(x.Items||0),0)],['Filtered rows',currentRows.length]]:
 [['Suppliers',all.length],['Active',all.filter(x=>x.Status==='Active').length],['Disabled',all.filter(x=>x.Status==='Disabled').length],['Filtered rows',currentRows.length]];
 $('metrics').innerHTML=cards.map(c=>'<div class="metric"><small>'+c[0]+'</small><strong>'+c[1]+'</strong></div>').join('');
 $('notice').textContent='Showing '+currentRows.length+' row(s) after search, status and date filters. Excel export creates an Excel-compatible workbook; PDF uses your browser print dialog.';
}
async function load(){try{ $('notice').textContent='Loading…';[data.suppliers,data.rfqs,data.quotations]=await Promise.all([get('/api/suppliers'),get('/api/rfqs'),get('/api/quotations')]);draw();}catch(e){ $('notice').textContent='Unable to load data: '+e.message+' — check login and API access.';$('notice').className='notice error';}}
function csvCell(v){let s=String(v??'');if(s.includes('"'))s=s.replaceAll('"','""');return '"'+s+'"';}
$('csv').onclick=()=>{const text=[currentHeaders.map(csvCell).join(','),...currentRows.map(r=>currentHeaders.map(h=>csvCell(h==='Total'?Number(r[h]||0).toFixed(2):r[h])).join(','))].join('\r\n');const blob=new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=$('type').value+'_report_'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(a.href);};
$('excel').onclick=()=>{const table='<table><thead><tr>'+currentHeaders.map(h=>'<th>'+escapeHtml(h)+'</th>').join('')+'</tr></thead><tbody>'+currentRows.map(r=>'<tr>'+currentHeaders.map(h=>'<td>'+escapeHtml(h==='Total'?Number(r[h]||0).toFixed(2):r[h])+'</td>').join('')+'</tr>').join('')+'</tbody></table>';const html='<html><head><meta charset=\"utf-8\"></head><body><h2>Supplier Quotation System — '+escapeHtml($('type').value)+' Report</h2><p>Generated: '+new Date().toLocaleString()+'</p>'+table+'<a id="globalMainAppButton" href="/" title="Return to Main App" style="position:fixed;left:18px;bottom:18px;z-index:99999;display:inline-flex;align-items:center;gap:8px;padding:12px 16px;border-radius:10px;background:#174ea6;color:#fff;text-decoration:none;font:600 14px Arial,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25)">⌂ Main App</a></body></html>';const blob=new Blob(['\ufeff',html],{type:'application/vnd.ms-excel;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=$('type').value+'_report_'+new Date().toISOString().slice(0,10)+'.xls';a.click();URL.revokeObjectURL(a.href);};
function escapeHtml(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('\"','&quot;');}
$('pdf').onclick=()=>window.print();$('refresh').onclick=load;$('type').onchange=draw;$('search').oninput=draw;$('status').onchange=draw;$('from').onchange=draw;$('to').onchange=draw;$('clear').onclick=()=>{$('search').value='';$('status').value='';$('from').value='';$('to').value='';draw();};load();
</script></body></html>
