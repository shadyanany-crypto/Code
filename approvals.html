<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Approvals</title><style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121e31;--line:#263650;--text:#eaf2ff;--muted:#9db0ca;--blue:#3b82f6;--green:#16a34a;--red:#dc2626}*{box-sizing:border-box}body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:15px system-ui,Segoe UI,Arial}main{max-width:1200px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin:18px 0}p,small{color:var(--muted)}input,select,button{font:inherit;padding:10px;border:1px solid var(--line);border-radius:9px;background:#0b1526;color:var(--text)}button{cursor:pointer;background:var(--blue);border:0;font-weight:600}.btn2{background:#25364f}.approve{background:var(--green)}.reject{background:var(--red)}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:760px}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line)}.actions{display:flex;gap:6px;flex-wrap:wrap}.note{width:100%;min-width:130px}.status{font-weight:700}.message{color:#93c5fd;margin-top:12px}@media(max-width:600px){body{padding:10px}.panel{padding:12px}}

/* Phase 13 — Premium dark-blue UI refresh */
:root{
 --bg:#060d19!important;--panel:#0d1a2d!important;--line:#1d3554!important;
 --text:#edf5ff!important;--muted:#91a8c6!important;--blue:#087cff!important;
 --green:#10b981!important;--amber:#f59e0b!important;--red:#ef4444!important;
}
html{scroll-behavior:smooth}
body{background:radial-gradient(ellipse at 12% -10%,#102b50 0,transparent 36%),radial-gradient(ellipse at 100% 0,#0a2140 0,transparent 30%),#060d19!important;color:#edf5ff!important;font-family:Inter,"Segoe UI",system-ui,Arial,sans-serif!important}
main,.wrap{max-width:1320px!important}
h1{font-size:clamp(24px,3vw,34px)!important;letter-spacing:-.6px;font-weight:750!important}
h2{letter-spacing:-.3px}
p,small,.muted,.sub{color:#91a8c6!important}
.panel,.tile,.cards>div,.card{background:linear-gradient(145deg,rgba(15,31,52,.97),rgba(9,20,36,.98))!important;border:1px solid #1d3554!important;border-radius:16px!important;box-shadow:0 12px 32px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.025)!important}
input,select,textarea{background:#071426!important;border:1px solid #294465!important;color:#edf5ff!important;border-radius:10px!important;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none!important;border-color:#1687ff!important;box-shadow:0 0 0 3px rgba(8,124,255,.16)!important}
button,.btn,.actions a,.head a,header a{border-radius:10px!important;transition:transform .15s,filter .15s,background .15s}
button:not(.secondary):not(.btn2){background:linear-gradient(135deg,#087cff,#075bd4)!important;color:#fff!important;box-shadow:0 5px 15px rgba(8,124,255,.16)}
button:hover,a:hover{filter:brightness(1.13);transform:translateY(-1px)}
.secondary,.btn2{background:#172b45!important;color:#dcecff!important;border:1px solid #294465!important}
a{color:#7fc0ff}
table{border-collapse:separate!important;border-spacing:0!important;border:1px solid #1d3554!important;border-radius:12px!important;overflow:hidden}
th{background:#10243d!important;color:#d9eaff!important;font-weight:650!important}
td,th{border-bottom:1px solid #1b304b!important;padding:12px!important}
tr:hover td{background:rgba(17,52,88,.22)}
hr{border:0;border-top:1px solid #1d3554}
.badge,.status{border-radius:999px!important}
@media(max-width:700px){
 body{padding:12px!important}
 main,.wrap{padding-left:0!important;padding-right:0!important}
 .panel{padding:14px!important;margin:12px 0!important}
 table{min-width:680px}
 h1{font-size:24px!important}
}

</style><style>
/* Phase 14 — Dashboard and Portal visual polish */
body:has(.cards) .cards{gap:16px}
body:has(.cards) .card{position:relative;overflow:hidden;padding:20px 21px!important;min-height:112px}
body:has(.cards) .card:before{content:"";position:absolute;right:-34px;top:-42px;width:110px;height:110px;border-radius:50%;background:rgba(8,124,255,.09);pointer-events:none}
.metric{font-size:clamp(28px,3vw,36px)!important;line-height:1.15;color:#f5f9ff!important;letter-spacing:-1px}
.label{font-size:12px!important;letter-spacing:.5px;text-transform:uppercase;color:#9bb4d2!important;font-weight:650}
.head{padding-bottom:6px}
.head h1{background:linear-gradient(90deg,#f4f8ff,#8fc7ff);-webkit-background-clip:text;background-clip:text;color:transparent!important}
.actions button{border:1px solid rgba(88,145,210,.22)!important}
.grid{gap:16px!important}
.panel{padding:20px!important}
.panel h2{margin-top:0;color:#e7f2ff!important}
.tile{background:linear-gradient(150deg,#10233c,#0a1729)!important;transition:transform .18s,border-color .18s,box-shadow .18s}
.tile:hover{transform:translateY(-3px);border-color:#2f75c4!important;box-shadow:0 12px 30px rgba(0,0,0,.2)}
.tile h3{font-size:17px!important;color:#f0f7ff}
.tag{border:1px solid #2b4b70!important;background:#102b49!important;color:#9bcaff!important}
table{width:100%}
@media(max-width:780px){
 .grid{grid-template-columns:1fr!important}
 .head{align-items:flex-start!important}
 .actions{width:100%}
 .actions button{flex:1}
}
</style></head><body><main><div class="head"><div><h1>Approval Workflow</h1><p>Review quotations, approve/reject, and award the selected supplier.</p></div><div class="actions"><button class="btn2" onclick="location.href='/comparison.html'">Price Comparison</button><button class="btn2" onclick="location.href='/'">Main App</button><button onclick="load()">Refresh</button></div></div>
<section class="cards" id="approvalMetrics" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:18px 0"><div class="panel"><small>Total quotations</small><h2 id="metricTotal">0</h2></div><div class="panel"><small>Awaiting decision</small><h2 id="metricPending">0</h2></div><div class="panel"><small>Approved</small><h2 id="metricApproved">0</h2></div><div class="panel"><small>Rejected</small><h2 id="metricRejected">0</h2></div><div class="panel"><small>Awarded</small><h2 id="metricAwarded">0</h2></div></section>
<section class="panel"><div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px"><input id="approvalSearch" placeholder="Search RFQ, supplier, quote..." oninput="renderApprovals()" style="flex:1;min-width:200px"><select id="approvalStatus" onchange="renderApprovals()"><option value="all">All statuses</option><option>Submitted</option><option>Pending</option><option>Approved</option><option>Rejected</option><option>Awarded</option></select><button class="btn2" onclick="exportApprovals()">Export filtered CSV</button><span id="approvalCount" class="message"></span></div><div class="scroll"><table><thead><tr><th>RFQ</th><th>Supplier</th><th>Quote</th><th>Total incl. tax</th><th>Status</th><th>Decision Note</th><th>Reviewed By</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div><div id="msg" class="message"></div></section><footer><small>Copyright © Shady Anany</small></footer></main>
<script>
const token=localStorage.getItem("sqAccessToken")||localStorage.getItem("sq_token");if(!token)location.href="/";const $=x=>document.getElementById(x);
async function api(path,method="GET",body){let r=await fetch("/api"+path,{method,headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error(await r.text()||r.status);return r.status===204?null:r.json()}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const total=q=>(q.lines||[]).reduce((sum,l)=>sum+Number(l.quantity)*Number(l.unitPrice)*(1+Number(l.taxPercent||0)/100),0);
let quotations=[];
function renderApprovals(){let term=$("approvalSearch").value.toLowerCase(),status=$("approvalStatus").value;let counts={total:quotations.length,pending:quotations.filter(q=>["Submitted","Pending"].includes(q.status)).length,approved:quotations.filter(q=>q.status==="Approved").length,rejected:quotations.filter(q=>q.status==="Rejected").length,awarded:quotations.filter(q=>q.status==="Awarded"||q.awarded).length};$("metricTotal").textContent=counts.total;$("metricPending").textContent=counts.pending;$("metricApproved").textContent=counts.approved;$("metricRejected").textContent=counts.rejected;$("metricAwarded").textContent=counts.awarded;let list=quotations.filter(q=>(status==="all"||q.status===status)&&[q.rfq?.rfqNumber,q.supplier?.name,q.quoteNumber,q.status].join(" ").toLowerCase().includes(term));$("approvalCount").textContent=`Showing ${list.length} of ${quotations.length}`;$("rows").innerHTML=list.map(q=>`<tr><td>${esc(q.rfq?.rfqNumber||q.rfqId)}</td><td>${esc(q.supplier?.name||q.supplierId)}</td><td>${esc(q.quoteNumber)}<br><small>${esc(q.currency)}</small></td><td>${total(q).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})} ${esc(q.currency)}</td><td class="status">${esc(q.status)}${q.awarded?" ★":""}</td><td><input class="note" id="note${q.id}" value="${esc(q.decisionNote||"")}" placeholder="Reviewer note"></td><td>${esc(q.reviewedBy||"—")}</td><td><div class="actions">${q.status!=="Awarded"?`<button class="approve" onclick="decide(${q.id},'Approved')">Approve</button><button class="reject" onclick="decide(${q.id},'Rejected')">Reject</button>`:""}${q.status==="Approved"?`<button onclick="award(${q.id})">Award</button>`:""}<button class="btn2" onclick="decisionHistory(${q.id})">History</button><button class="btn2" onclick="report(${q.id})">Report</button></div></td></tr>`).join("");}
async function load(){try{quotations=await api("/quotations");renderApprovals();$("msg").textContent="Loaded "+quotations.length+" quotation(s). Admin role is required for decisions."}catch(e){$("msg").textContent="Load failed: "+e.message}}
function exportApprovals(){let term=$("approvalSearch").value.toLowerCase(),status=$("approvalStatus").value;let list=quotations.filter(q=>(status==="all"||q.status===status)&&[q.rfq?.rfqNumber,q.supplier?.name,q.quoteNumber,q.status].join(" ").toLowerCase().includes(term));let rows=[["RFQ","Supplier","Quote","Currency","Total incl tax","Status","Decision note","Reviewed by"],...list.map(q=>[q.rfq?.rfqNumber||q.rfqId,q.supplier?.name||q.supplierId,q.quoteNumber,q.currency,total(q).toFixed(2),q.status,q.decisionNote,q.reviewedBy])];let csv=rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\\r\\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\\ufeff"+csv],{type:"text/csv;charset=utf-8"}));a.download="ApprovalWorkflow_Filtered.csv";a.click();URL.revokeObjectURL(a.href)}
async function decide(id,decision){let note=$("note"+id).value.trim();if(decision==="Rejected"&&!note){$("msg").textContent="Please enter a rejection reason before rejecting this quotation.";$("note"+id).focus();return}if(decision==="Rejected"&&!confirm("Reject this quotation using the entered reason?"))return;try{await api(`/quotations/${id}/decision`,"PATCH",{decision,note});$("msg").textContent=`Quotation ${decision.toLowerCase()} successfully.`;load()}catch(e){$("msg").textContent=e.message}}
async function award(id){if(!confirm("Award this approved quotation? Other awarded quotation for this RFQ will be unset."))return;try{await api(`/quotations/${id}/award`,"PATCH");load()}catch(e){$("msg").textContent=e.message}}
async function decisionHistory(id){try{const result=await api(`/quotations/${id}/decision-history`);if(!result.items.length){alert(`Quotation #${id}: no recorded approval, rejection, or award history yet.`);return}const lines=result.items.map(x=>`${new Date(x.occurredUtc).toLocaleString()} | ${x.action} | ${x.actorUsername} (${x.actorRole})\n${x.details||"—"}`).join("\n\n");alert(`Decision History — Quotation #${id}\n\n${lines}`)}catch(e){$("msg").textContent="History load failed: "+e.message}}
async function report(id){try{let qs=await api("/quotations"),q=qs.find(x=>x.id===id);let lines=(q.lines||[]).map(l=>`<tr><td>${esc(l.rfqItem?.itemCode||l.rfqItemId)}</td><td>${esc(l.rfqItem?.description||"")}</td><td>${l.quantity}</td><td>${Number(l.unitPrice).toFixed(2)}</td><td>${Number(l.taxPercent||0).toFixed(2)}%</td><td>${(Number(l.quantity)*Number(l.unitPrice)*(1+Number(l.taxPercent||0)/100)).toFixed(2)}</td></tr>`).join("");let w=window.open("","_blank");w.document.write(`<!doctype html><html><head><title>Quotation Review Report</title><style>body{font:14px Arial;margin:30px;color:#111}h1{margin-bottom:4px}table{width:100%;border-collapse:collapse;margin-top:18px}td,th{border:1px solid #888;padding:8px;text-align:left}.meta{line-height:1.8}@media print{button{display:none}}</style></head><body><h1>Supplier Quotation Review Report</h1><div class="meta"><b>RFQ:</b> ${esc(q.rfq?.rfqNumber)} - ${esc(q.rfq?.title)}<br><b>Supplier:</b> ${esc(q.supplier?.name)}<br><b>Quotation:</b> ${esc(q.quoteNumber)}<br><b>Currency:</b> ${esc(q.currency)}<br><b>Status:</b> ${esc(q.status)} ${q.awarded?"(AWARDED)":""}<br><b>Reviewer:</b> ${esc(q.reviewedBy||"—")}<br><b>Review Date:</b> ${esc(q.reviewedUtc||"—")}<br><b>Decision Notes:</b> ${esc(q.decisionNote||"—")}</div><table><thead><tr><th>Item Code</th><th>Description</th><th>Qty</th><th>Unit Price</th><th>Tax</th><th>Line Total</th></tr></thead><tbody>${lines}</tbody><tfoot><tr><th colspan="5">Grand Total (incl. tax)</th><th>${total(q).toFixed(2)} ${esc(q.currency)}</th></tr></tfoot></table><p>Copyright © Shady Anany</p><button onclick="print()">Print / Save as PDF</button><a id="globalMainAppButton" href="/" title="Return to Main App" style="position:fixed;left:18px;bottom:18px;z-index:99999;display:inline-flex;align-items:center;gap:8px;padding:12px 16px;border-radius:10px;background:#174ea6;color:#fff;text-decoration:none;font:600 14px Arial,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25)">⌂ Main App</a></body></html>`);w.document.close()}catch(e){$("msg").textContent=e.message}}
load();
</script></body></html>
