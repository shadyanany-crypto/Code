<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Follow-up Reminders</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#111c2e;--line:#26364f;--text:#e8eef8;--muted:#9aacc5;--blue:#4d8dff;--red:#ff647c;--amber:#ffc15a;--green:#55d6a3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Segoe UI,Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:28px}.head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{margin:0 0 6px}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:24px 0}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.num{font-size:30px;font-weight:700;margin-top:8px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}input,select,button{background:#0d1728;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px 12px}button{cursor:pointer;background:#1b3764;border-color:#315b9a}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600}.scroll{overflow:auto}.tag{padding:4px 8px;border-radius:20px;font-size:12px;background:#26364f}.urgent{color:var(--red)}.high{color:var(--amber)}.done{color:var(--green)}.empty{padding:24px;text-align:center;color:var(--muted)}
</style></head><body><main class="wrap"><div class="head"><div><h1>Follow-up Reminders</h1><div class="muted">Due today, overdue, and upcoming supplier quotation follow-ups</div></div><button id="reload">Refresh</button></div>
<div class="cards"><div class="card"><div class="muted">Due Today</div><div class="num" id="today">—</div></div><div class="card"><div class="muted">Overdue</div><div class="num" id="overdue">—</div></div><div class="card"><div class="muted">Urgent Open</div><div class="num" id="urgent">—</div></div><div class="card"><div class="muted">Upcoming 7 Days</div><div class="num" id="upcoming">—</div></div></div>
<section class="panel"><div class="toolbar"><input id="search" placeholder="Search supplier, quotation, RFQ..."/><select id="filter"><option value="all">All reminders</option><option value="overdue">Overdue</option><option value="today">Due today</option><option value="upcoming">Upcoming</option><option value="urgent">Urgent</option><option value="read">Marked read</option><option value="unread">Unread</option></select></div><div class="scroll"><table><thead><tr><th>Due date</th><th>Supplier</th><th>Quotation / RFQ</th><th>Priority</th><th>Status</th><th>Note</th><th>Reminder</th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" class="empty" hidden>No follow-up reminders match the selected filter.</div></section></main>
<script>
const token=localStorage.getItem('sqAccessToken')||localStorage.getItem('sq_token');const readKey='sq_followup_reminders_read';let readIds=new Set(JSON.parse(localStorage.getItem(readKey)||'[]'));let items=[];
const dateOnly=v=>{const d=new Date(v);return new Date(d.getFullYear(),d.getMonth(),d.getDate())};const today=dateOnly(new Date());const dayDiff=v=>Math.round((dateOnly(v)-today)/86400000);const open=x=>x.followUpStatus==='Open';const isRead=x=>readIds.has(String(x.id));
function bucket(x){const diff=dayDiff(x.followUpDateUtc);return diff<0?'overdue':diff===0?'today':'upcoming'}
function draw(){const q=document.getElementById('search').value.toLowerCase();const f=document.getElementById('filter').value;const filtered=items.filter(x=>{const text=[x.supplierName,x.quoteNumber,x.rfqNumber,x.rfqTitle,x.notes].join(' ').toLowerCase();if(!open(x)||!text.includes(q))return false;const b=bucket(x);return f==='all'||f===b||(f==='urgent'&&x.priority==='Urgent')||(f==='read'&&isRead(x))||(f==='unread'&&!isRead(x));}).sort((a,b)=>new Date(a.followUpDateUtc)-new Date(b.followUpDateUtc));
const tbody=document.getElementById('rows');tbody.innerHTML='';filtered.forEach(x=>{const tr=document.createElement('tr');const p=x.priority==='Urgent'?'urgent':x.priority==='High'?'high':'';tr.innerHTML=`<td>${new Date(x.followUpDateUtc).toLocaleDateString()}</td><td>${esc(x.supplierName||'')}</td><td>${esc(x.quoteNumber||'')}<br><span class="muted">${esc(x.rfqNumber||'')} ${esc(x.rfqTitle||'')}</span></td><td class="${p}">${esc(x.priority||'Normal')}</td><td><span class="tag">${esc(x.followUpStatus||'Open')}</span></td><td>${esc(x.notes||'')}</td><td><button data-id="${x.id}">${isRead(x)?'Read':'Mark read'}</button></td>`;tr.querySelector('button').onclick=()=>{readIds.add(String(x.id));localStorage.setItem(readKey,JSON.stringify([...readIds]));draw()};tbody.appendChild(tr)});document.getElementById('empty').hidden=filtered.length>0;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){if(!token){document.getElementById('rows').innerHTML='<tr><td colspan="7">Please sign in first.</td></tr>';return}try{const r=await fetch('/api/followups/',{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw new Error('API request failed: '+r.status);items=await r.json();const openItems=items.filter(open);document.getElementById('today').textContent=openItems.filter(x=>bucket(x)==='today').length;document.getElementById('overdue').textContent=openItems.filter(x=>bucket(x)==='overdue').length;document.getElementById('urgent').textContent=openItems.filter(x=>x.priority==='Urgent').length;document.getElementById('upcoming').textContent=openItems.filter(x=>dayDiff(x.followUpDateUtc)>0&&dayDiff(x.followUpDateUtc)<=7).length;draw()}catch(e){document.getElementById('rows').innerHTML='<tr><td colspan="7">Unable to load reminders: '+esc(e.message)+'</td></tr>'}}
document.getElementById('reload').onclick=load;document.getElementById('search').oninput=draw;document.getElementById('filter').onchange=draw;load();
</script><a id="globalMainAppButton" href="/" title="Return to Main App" style="position:fixed;left:18px;bottom:18px;z-index:99999;display:inline-flex;align-items:center;gap:8px;padding:12px 16px;border-radius:10px;background:#174ea6;color:#fff;text-decoration:none;font:600 14px Arial,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25)">⌂ Main App</a></body></html>
